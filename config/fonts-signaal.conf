<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Optional: copy to ~/.config/fontconfig/conf.d/ only if you want
     General Sans as the sans default. ChefApp already names the face in CSS.
     IBM Plex Mono is OFL; General Sans is Fontshare — do not CDN. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>General Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>IBM Plex Mono</family>
    </prefer>
  </alias>
</fontconfig>
