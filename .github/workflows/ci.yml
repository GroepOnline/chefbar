name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# PRs → pr-isolated; push → heavy. Do not use company-control alone — that
# label is on the heavy runner too and queues behind unrelated heavy work.
jobs:
  build:
    name: Rust build + test
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo / target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.2)
        with:
          shared-key: chefbar-build
          cache-bin: "false"

      - name: Cargo check (fast gate)
        run: cargo check --all-targets

      - name: Format (harde gate)
        run: cargo fmt --all -- --check

      - name: Clippy (harde gate, warnings = fail)
        run: cargo clippy --all-targets -- -D warnings

      - name: Shellcheck
        run: shellcheck install.sh .cursor/*.sh scripts/*.sh

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: chefbar-release
          path: target/release/chefbar
          if-no-files-found: error

      - name: Smoke install dry-run
        run: |
          bash -n install.sh
          ./install.sh --help
          # profile bootstrap smoke (no network, no daemon)
          ls -la config/endpoints.example.json config/endpoints.tailnet.example.json chefbar.service
          systemd-analyze verify chefbar.service 2>&1 || echo "verify skip (no systemd target in runner, non-fatal)"

  visual:
    name: Visual shot (Xvfb + accent assert)
    needs: build
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install X stack
        run: |
          if command -v Xvfb >/dev/null 2>&1 && command -v import >/dev/null 2>&1; then
            echo "X-tools al aanwezig"
          else
            # Runner-service heeft NoNewPrivileges=true: sudo faalt hier.
            # Tools staan op de host (apt) en zijn door chef-ci-pr uitvoerbaar;
            # alleen bij echte afwezigheid is de visual-step een zachte skip.
            sudo -n apt-get update -qq && sudo -n apt-get install -y -qq xvfb imagemagick 2>&1 || echo "install overgeslagen (geen sudo in runner-service)"
          fi
          if command -v Xvfb && command -v import; then
            echo "X-stack OK"
          else
            echo "X-stack ontbreekt — visual-shot wordt zachte skip (exit 2)"
          fi

      - name: Fetch release binary from build job
        uses: actions/download-artifact@v4
        with:
          name: chefbar-release
          path: artifact

      - name: Place binary at expected path
        run: |
          mkdir -p target/release
          mv artifact/chefbar target/release/chefbar
          chmod +x target/release/chefbar

      - name: Visual assert — panel (dark, harde accent-check)
        run: |
          scripts/visual-shot.sh panel dark /tmp/chefbar-dark-panel.png
          rc=$?
          if [ "$rc" -eq 2 ]; then echo "visual-shot panel: X-stack niet beschikbaar — zachte skip"; exit 0; fi
          exit "$rc"

      - name: Visual assert — palette overlay (warning-only)
        continue-on-error: true
        run: |
          scripts/visual-shot.sh palette dark /tmp/chefbar-dark-palette.png
          rc=$?
          if [ "$rc" -eq 2 ]; then echo "visual-shot palette: X-stack niet beschikbaar — zachte skip"; exit 0; fi
          exit "$rc"

      - name: Visual assert — drawer (warning-only)
        continue-on-error: true
        run: |
          scripts/visual-shot.sh drawer dark /tmp/chefbar-dark-drawer.png
          rc=$?
          if [ "$rc" -eq 2 ]; then echo "visual-shot drawer: X-stack niet beschikbaar — zachte skip"; exit 0; fi
          exit "$rc"

      - name: Visual assert — density toggle (warning-only)
        continue-on-error: true
        run: |
          scripts/visual-shot.sh density-compact dark /tmp/chefbar-dark-density-compact.png
          rc1=$?
          scripts/visual-shot.sh density-comfortable dark /tmp/chefbar-dark-density-comfortable.png
          rc2=$?
          # zachte skip als X-stack ontbreekt; anders warning-only
          if [ "$rc1" -eq 2 ] || [ "$rc2" -eq 2 ]; then echo "density: X-stack niet beschikbaar — zachte skip"; exit 0; fi
          [ "$rc1" -eq 0 ] && [ "$rc2" -eq 0 ] || echo "density: warning-only (rc1=$rc1 rc2=$rc2)"

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chefbar-visual-shots
          path: /tmp/chefbar-*.png
          if-no-files-found: ignore
