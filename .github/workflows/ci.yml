name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rust build + test
    runs-on: [self-hosted, Linux, X64, company-control]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          cache: false

      - name: Cache ~/.cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: chefbar-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            chefbar-cargo-${{ runner.os }}-

      - name: Cache target
        uses: actions/cache@v4
        with:
          path: target
          key: chefbar-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            chefbar-target-${{ runner.os }}-

      - name: Cargo check (fast gate)
        run: cargo check --all-targets

      - name: Shellcheck
        run: shellcheck install.sh

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: chefbar-release
          path: target/release/chefbar
          if-no-files-found: error

      - name: Smoke install dry-run
        run: |
          bash -n install.sh
          ./install.sh --help
          # profile bootstrap smoke (no network, no daemon)
          ls -la config/endpoints.example.json config/endpoints.tailnet.example.json chefbar.service
          systemd-analyze verify chefbar.service 2>&1 || echo "verify skip (no systemd target in runner, non-fatal)"
