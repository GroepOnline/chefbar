name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rust build + test
    runs-on: [self-hosted, Linux, X64, company-control]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ~/.cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: chefbar-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            chefbar-cargo-${{ runner.os }}-

      - name: Cache target
        uses: actions/cache@v4
        with:
          path: target
          key: chefbar-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            chefbar-target-${{ runner.os }}-

      - name: Cargo check (fast gate)
        run: cargo check --all-targets

      - name: Shellcheck
        run: shellcheck install.sh scripts/visual-shot.sh scripts/gate.sh

      - name: QA-gate (fmt · clippy · tests)
        run: scripts/gate.sh

      - name: Build release
        run: cargo build --release

      - name: Layer-shell feature-build (optioneel, pkg-config)
        run: |
          # .pc-naam varieert per distro (gtk-layer-shell-0 op nieuwere, -0.1 op oudere)
          if pkg-config --exists gtk-layer-shell-0 2>/dev/null || pkg-config --exists gtk-layer-shell-0.1 2>/dev/null; then
            cargo build --release --features layer-shell
          else
            echo "layer-shell dev-lib ontbreekt — feature-build overgeslagen (X11-fallback is de default)"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: chefbar-release
          path: target/release/chefbar
          if-no-files-found: error

      - name: Smoke install dry-run
        run: |
          bash -n install.sh
          ./install.sh --help
          # profile bootstrap smoke (no network, no daemon)
          ls -la config/endpoints.example.json config/endpoints.tailnet.example.json chefbar.service
          systemd-analyze verify chefbar.service 2>&1 || echo "verify skip (no systemd target in runner, non-fatal)"

  visual:
    name: Visual shot (Xvfb + accent assert)
    needs: build
    runs-on: [self-hosted, Linux, X64, company-control]
    steps:
      - uses: actions/checkout@v4

      - name: Install X stack
        run: |
          if command -v Xvfb >/dev/null 2>&1 && command -v import >/dev/null 2>&1; then
            echo "X-tools al aanwezig"
          else
            # Runner-service heeft NoNewPrivileges=true: sudo faalt hier.
            # Tools staan op de host (apt) en zijn door chef-ci-pr uitvoerbaar;
            # alleen bij echte afwezigheid is de visual-step een zachte skip.
            sudo -n apt-get update -qq && sudo -n apt-get install -y -qq xvfb imagemagick 2>&1 || echo "install overgeslagen (geen sudo in runner-service)"
          fi
          if command -v Xvfb && command -v import; then
            echo "X-stack OK"
          else
            echo "X-stack ontbreekt — visual-shot wordt zachte skip (exit 2)"
          fi

      - name: Fetch release binary from build job
        uses: actions/download-artifact@v4
        with:
          name: chefbar-release
          path: artifact

      - name: Place binary at expected path
        run: |
          mkdir -p target/release
          mv artifact/chefbar target/release/chefbar
          chmod +x target/release/chefbar

      - name: Visual assert (dark)
        run: |
          scripts/visual-shot.sh dark /tmp/chefbar-dark.png
          # zachte skip (exit 2) is acceptabel, harde fail (1) niet
          rc=$?
          [ "$rc" -eq 2 ] && echo "visual-shot: X-stack niet beschikbaar — zachte skip" || exit "$rc"

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chefbar-visual-shot
          path: /tmp/chefbar-*.png
          if-no-files-found: ignore
