name: Release

# Product name is ChefApp; the crate/binary stays `chefbar` until Joep
# renames the repo. Tags `v*` build on the company-control heavy lane
# (never ubuntu-latest; never the `company-control` label alone).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ChefApp Linux x86_64
    runs-on: [self-hosted, Linux, X64, heavy]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build release
        run: cargo build --release --locked

      - name: Upload ChefApp binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chefapp-linux-x86_64
          path: target/release/chefbar
          if-no-files-found: error

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -m 0755 target/release/chefbar "chefbar-linux-x86_64"

          tag="${GITHUB_REF_NAME}"
          asset="chefbar-linux-x86_64"

          peeled_sha="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{print $1}' | head -1 || true)"
          if [ -n "${peeled_sha}" ]; then
            tag_sha="${peeled_sha}"
          else
            tag_sha="$(git ls-remote origin "refs/tags/${tag}" | awk '{print $1}' | head -1 || true)"
          fi
          if [ -z "${tag_sha}" ]; then
            echo "Remote tag ${tag} not found"
            exit 1
          fi
          if [ "${tag_sha}" != "${GITHUB_SHA}" ]; then
            echo "Tag ${tag} resolves to ${tag_sha}, expected ${GITHUB_SHA}"
            exit 1
          fi

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; uploading ${asset}"
            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --json assets -q ".assets[].name" | grep -qx "${asset}"; then
              gh release upload "${tag}" "${asset}" \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber
            else
              gh release upload "${tag}" "${asset}" \
                --repo "${GITHUB_REPOSITORY}"
            fi
            if [ "$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft -q .isDraft)" = "true" ]; then
              gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false
            fi
          else
            gh release create "${tag}" \
              "${asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "ChefApp ${tag}" \
              --generate-notes \
              --verify-tag
          fi
