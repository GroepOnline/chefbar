[package]
name = "chefbar"
version = "3.2.0"
edition = "2021"
description = "ChefBar — ChefGroep assistent-app (Rust native, Signaal · Huly)"
license = "MIT"
default-run = "chefbar"

[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
ksni = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
dirs = "5"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
libc = "0.2"
pango = "0.18"
gdk = "0.18"
# E2: Wayland layer-shell (optioneel — systeembibliotheek libgtk-layer-shell
# nodig op build- én runtime-machine, vandaar default uit).
gtk-layer-shell = { version = "0.8", optional = true }

[features]
default = []
# v0_6 = nieuwste C-API (libgtk-layer-shell >= 0.3); valt terug op v0_5/v0_4
# voor oudere systeembibliotheken.
layer-shell = ["gtk-layer-shell/v0_6"]

[profile.release]
lto = true
strip = true
# P4: footprint — abort i.p.v. unwind-landschap → kleinere binary, minder
# runtime-code. Geen gedragsverschil voor deze app (geen catches over FFI).
panic = "abort"

[[bin]]
name = "chefbar"
path = "src/main.rs"