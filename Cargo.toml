[package]
name = "chefbar"
version = "4.0.0-dev"
edition = "2021"
description = "ChefBar — ChefGroep assistent-app (Rust native, Signaal v2 · Devin-richting)"
license = "MIT"
default-run = "chefbar"

[dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
ksni = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
dirs = "5"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
libc = "0.2"
pango = "0.18"
gdk = "0.18"

[profile.release]
lto = true
strip = true

[[bin]]
name = "chefbar"
path = "src/main.rs"